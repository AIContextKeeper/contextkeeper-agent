name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.21
    
    - name: Get version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Build binaries
      run: |
        # Build for multiple platforms
        PLATFORMS=(
          "darwin/amd64"
          "darwin/arm64" 
          "linux/amd64"
          "linux/arm64"
          "windows/amd64"
        )
        
        for platform in "${PLATFORMS[@]}"; do
          IFS='/' read -r os arch <<< "$platform"
          
          output_name="contextkeeper-agent-${os}-${arch}"
          if [ "$os" = "windows" ]; then
            output_name="${output_name}.exe"
          fi
          
          echo "Building for ${os}/${arch}..."
          GOOS=$os GOARCH=$arch go build \
            -ldflags="-X main.version=${{ steps.version.outputs.VERSION }} -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "bin/${output_name}" \
            ./cmd/agent
        done
    
    - name: Create release archives
      run: |
        cd bin
        for file in contextkeeper-agent-*; do
          if [[ "$file" == *"windows"* ]]; then
            cp "$file" contextkeeper-agent.exe
            zip "${file}.zip" contextkeeper-agent.exe
            rm contextkeeper-agent.exe
          else
            cp "$file" contextkeeper-agent
            tar -czf "${file}.tar.gz" contextkeeper-agent
            rm contextkeeper-agent
          fi
        done
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          bin/*.zip
          bin/*.tar.gz
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}